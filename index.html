<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTask | Professional To-Do List</title>
    <!-- Link external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons for buttons and UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <h1><i class="fa-solid fa-check-double"></i> ProTask</h1>
            <p>Organize your day, boost your productivity.</p>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off">
                <button id="addTaskBtn" class="add-btn">
                    <i class="fa-solid fa-plus"></i> Add Task
                </button>
            </div>
        </div>

        <!-- Controls / Filters & Counter Section -->
        <div class="controls-section">
            <div class="task-stats">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Completed: <strong id="completedCount">0</strong></span>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Task List Section -->
        <div class="task-container">
            <ul id="taskList" class="task-list">
                <!-- Dynamic tasks will be inserted here by JavaScript -->
            </ul>

            <!-- Empty State Message -->
            <div id="emptyState" class="empty-state">
                <i class="fa-regular fa-clipboard"></i>
                <h3>No tasks found</h3>
                <p>Add a new task above to get started!</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Built with <i class="fa-solid fa-heart"></i> for Portfolio &amp; Internship</p>
        </footer>
    </div>

    <!-- Link external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
